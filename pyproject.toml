[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-orbit-gateway"
version = "0.1.0"
description = "Orbit chat platform adapter for Hermes Agent (channels, threads, DMs)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: real errors, W: warnings, I: import order, B: bugbear, UP: pyupgrade,
# ASYNC2xx: blocking calls on the gateway event loop (the adapters run there).
select = ["E", "F", "W", "I", "B", "UP", "ASYNC210", "ASYNC220", "ASYNC221", "ASYNC251"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
